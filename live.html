<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dawn Noir - Live Performances</title>
  <meta name="description" content="Dawn Noir live performances and upcoming gigs in Finland. Book us for your event. View live photos and stage information." />
  <meta name="keywords" content="Dawn Noir, live, gigs, concerts, Finland, Helsinki, bookings, stage map" />
  <meta name="author" content="Dawn Noir" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.dawnnoir.band/live.html" />
  <meta property="og:title" content="Dawn Noir - Live Performances" />
  <meta property="og:description" content="Dawn Noir live performances and upcoming gigs in Finland. Book us for your event." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.dawnnoir.band/live.html" />
  <meta property="og:image" content="https://www.dawnnoir.band/photos/20251015_0838.jpg" />
  <meta property="og:site_name" content="Dawn Noir" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dawn Noir - Live Performances" />
  <meta name="twitter:description" content="Dawn Noir live performances and upcoming gigs in Finland. Book us for your event." />
  <meta name="twitter:image" content="https://www.dawnnoir.band/photos/20251015_0838.jpg" />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "Dawn Noir",
  "url": "https://www.dawnnoir.band/",
  "sameAs": [
    "https://open.spotify.com/artist/4akxsTsjiVYzlfeW8yhOFY"
  ]
}
</script>
  <style>
    :root {
      --bg-dark: #000000;
      --fg-light: #ffffff;
      --accent: #cccccc;
      --font-main: Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--fg-light);
      line-height: 1.6;
    }
    header {
      padding: 0;
      border-bottom: 1px solid var(--accent);
    }
    header img.bio-header {
      width: 100%;
      height: auto;
      display: block;
    }
    nav {
      margin: 1rem 2rem;
      position: relative;
    }
    nav a {
      color: var(--fg-light);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      margin-right: 0.5rem;
    }
    nav a:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }
    .hamburger {
      display: none;
      cursor: pointer;
      background: var(--bg-dark);
      border: 1px solid var(--accent);
      width: 40px;
      height: 40px;
      padding: 0;
      position: relative;
      margin-bottom: 0.5rem;
    }
    .hamburger::before {
      content: "";
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--fg-light);
      box-shadow: 0 6px 0 var(--fg-light), 0 12px 0 var(--fg-light);
    }
    .nav-links {
      display: flex;
      gap: 0.5rem;
    }
    main {
      padding: 2rem;
    }
    .gigs {
      margin-bottom: 3rem;
    }
    .gigs h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .gig {
      padding: 1rem;
      border-bottom: 1px solid var(--accent);
    }
    .gig:last-child {
      border-bottom: none;
    }
    .gig .date {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .gig .venue {
      margin-bottom: 0.5rem;
    }
    .gallery {
      margin-top: 2rem;
    }
    .gallery h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .photo-grid img {
      width: 100%;
      height: auto;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: #111111;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-grid img:hover {
      transform: scale(1.02);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.98);
      overflow: auto;
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90%;
      margin-top: 5vh;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 40px;
      color: var(--fg-light);
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: var(--accent);
    }
    @media (max-width: 768px) {
      nav {
        margin: 1rem;
      }
      .hamburger {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg-dark);
        z-index: 100;
        border-top: 1px solid var(--accent);
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links a {
        width: 100%;
        margin-bottom: 0.5rem;
        margin-right: 0;
        padding: 0.75rem 1rem;
        text-align: center;
        border: 1px solid var(--accent);
        border-top: none;
      }
      .nav-links a:first-child {
        border-top: 1px solid var(--accent);
      }
      main {
        padding: 1rem;
      }
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
    }
    @media (max-width: 480px) {
      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
    footer {
      padding: 2rem;
      border-top: 1px solid var(--accent);
      text-align: center;
    }
    footer img.bio-header {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="photos/bio_header.png" alt="Dawn Noir Finnish alt-rock band header" class="bio-header" />
  </header>
  <nav aria-label="Main navigation">
    <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" onclick="toggleNav()"></button>
    <div class="nav-links">
      <a href="/" aria-label="Dawn Noir homepage">Home</a>
      <a href="/bio.html" aria-label="Dawn Noir biography">Bio</a>
      <a href="/live.html" aria-current="page">Live</a>
      <a href="/press.html" aria-label="Dawn Noir press kit">Press</a>
    </div>
  </nav>
  <main>
    <h1>Dawn Noir Live</h1>
    <section class="gigs" aria-labelledby="gigs-heading">
      <h2 id="gigs-heading">Upcoming Gigs</h2>
      <div class="gig">
        <div class="date">14.10.</div>
        <div class="venue">On the Rocks, Helsinki</div>
      </div>
      <div class="gig">
        <div class="date">16.10.</div>
        <div class="venue">Kotelo, Tampere</div>
      </div>
      <div class="gig">
        <div class="date">17.10.</div>
        <div class="venue">Nirvana/Fuusio, Turku</div>
      </div>
    </section>
    <section aria-labelledby="booking-heading">
      <h2 id="booking-heading">Bookings</h2>
      <p>Contact us for bookings: <a href="mailto:dawnnoirband@gmail.com" aria-label="Email Dawn Noir for bookings">dawnnoirband@gmail.com</a></p>
      <p>Channel list and stage map: <a href="https://drive.google.com/file/d/1JFST0dJz6V-gdWLbDIVXDTqG2gvV_AJU/view" aria-label="Download stage map and channel list">Download here</a>.</p>
    </section>
    <section class="gallery" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading">Live Photos</h2>
      <div class="photo-grid">
        <img src="photos/20251015_0838.jpg" alt="Dawn Noir live performance on stage" />
        <img src="photos/20251015_0248.jpg" alt="Dawn Noir band member performing live" />
        <img src="photos/20251015_0512.jpg" alt="Dawn Noir concert crowd interaction" />
        <img src="photos/20251015_0883.jpg" alt="Dawn Noir full band live shot" />
      </div>
    </section>
  </main>
  <footer>
    <p><a href="mailto:dawnnoirband@gmail.com" aria-label="Contact Dawn Noir via email">dawnnoirband@gmail.com</a></p>
  </footer>
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage" />
  </div>
  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const galleryImages = document.querySelectorAll(".photo-grid img");

    galleryImages.forEach(img => {
      img.onclick = function() {
        modal.style.display = "block";
        modalImg.src = this.src;
        modalImg.alt = this.alt;
      };
    });

    function closeModal() {
      modal.style.display = "none";
    }

    window.onkeydown = function(event) {
      if (event.key === "Escape") {
        closeModal();
      }
    };

    function toggleNav() {
      const navLinks = document.querySelector('.nav-links');
      const hamburger = document.querySelector('.hamburger');
      navLinks.classList.toggle('active');
      const isExpanded = navLinks.classList.contains('active');
      hamburger.setAttribute('aria-expanded', isExpanded);
    }
  </script>
</body>
</html>
