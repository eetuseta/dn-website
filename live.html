<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dawn Noir - Live</title>
  <style>
    :root {
      --bg-dark: #000000;
      --fg-light: #ffffff;
      --accent: #cccccc;
      --font-main: Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--fg-light);
      line-height: 1.6;
    }
    header {
      padding: 0;
      border-bottom: 1px solid var(--accent);
    }
    header img.bio-header {
      width: 100%;
      height: auto;
      display: block;
    }
    nav {
      margin: 1rem 2rem;
    }
    nav a {
      color: var(--fg-light);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      margin-right: 0.5rem;
    }
    nav a:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }
    main {
      padding: 2rem;
    }
    .gigs {
      margin-bottom: 3rem;
    }
    .gigs h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .gig {
      padding: 1rem;
      border-bottom: 1px solid var(--accent);
    }
    .gig:last-child {
      border-bottom: none;
    }
    .gig .date {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .gig .venue {
      margin-bottom: 0.5rem;
    }
    .gallery {
      margin-top: 2rem;
    }
    .gallery h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .photo-grid img {
      width: 100%;
      height: auto;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: #111111;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-grid img:hover {
      transform: scale(1.02);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.98);
      overflow: auto;
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90%;
      margin-top: 5vh;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 40px;
      color: var(--fg-light);
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: var(--accent);
    }
    footer {
      padding: 2rem;
      border-top: 1px solid var(--accent);
      text-align: center;
    }
    footer img.bio-header {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="photos/bio_header.png" alt="Dawn Noir" class="bio-header" />
  </header>
  <nav>
    <a href="/">Home</a>
    <a href="/bio.html">Bio</a>
    <a href="/live.html">Live</a>
    <a href="/press.html">Press</a>
  </nav>
  <main>
    <section class="gigs">
      <h2>Upcoming Gigs</h2>
      <div class="gig">
        <div class="date">14.10.</div>
        <div class="venue">On the Rocks, Helsinki</div>
      </div>
      <div class="gig">
        <div class="date">15.10.</div>
        <div class="venue">Kotelo, Tampere</div>
      </div>
      <div class="gig">
        <div class="date">16.10.</div>
        <div class="venue">Nirvana/Fuusio, Turku</div>
      </div>
    </section>
    <p>Bookings: <a href="mailto:dawnnoirband@gmail.com">dawnnoirband@gmail.com</a></p>
    <p>Channel list and stage map found <a href="https://drive.google.com/file/d/1JFST0dJz6V-gdWLbDIVXDTqG2gvV_AJU/view">here</a>.</p>
    <section class="gallery">
      <h2>Live Photos</h2>
      <div class="photo-grid">
        <img src="photos/20251015_0838.jpg" alt="Live Photo 1" />
        <img src="photos/20251015_0248.jpg" alt="Live Photo 2" />
        <img src="photos/20251015_0512.jpg" alt="Live Photo 3" />
        <img src="photos/20251015_0883.jpg" alt="Live Photo 4" />
      </div>
    </section>
  </main>
  <footer>
    <a href="mailto:dawnnoirband@gmail.com">dawnnoirband@gmail.com</a>
  </footer>
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage" />
  </div>
  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const galleryImages = document.querySelectorAll(".photo-grid img");

    galleryImages.forEach(img => {
      img.onclick = function() {
        modal.style.display = "block";
        modalImg.src = this.src;
        modalImg.alt = this.alt;
      };
    });

    function closeModal() {
      modal.style.display = "none";
    }

    window.onkeydown = function(event) {
      if (event.key === "Escape") {
        closeModal();
      }
    };
  </script>
</body>
</html>
