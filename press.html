  <style>
    :root {
      --bg-dark: #000000;
      --fg-light: #ffffff;
      --accent: #cccccc;
      --font-main: Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--fg-light);
      line-height: 1.6;
    }
    header {
      padding: 0;
      border-bottom: 1px solid var(--accent);
    }
    header img.bio-header {
      width: 100%;
      height: auto;
      display: block;
    }
    nav {
      margin: 1rem 2rem;
      position: relative;
    }
    nav a {
      color: var(--fg-light);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      margin-right: 0.5rem;
    }
    nav a:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }
    .hamburger {
      display: none;
      cursor: pointer;
      background: var(--bg-dark);
      border: 1px solid var(--accent);
      width: 40px;
      height: 40px;
      padding: 0;
      position: relative;
      margin-bottom: 0.5rem;
    }
    .hamburger::before {
      content: "";
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--fg-light);
      box-shadow: 0 6px 0 var(--fg-light), 0 12px 0 var(--fg-light);
    }
    .nav-links {
      display: flex;
      gap: 0.5rem;
    }
    main {
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    footer {
      padding: 2rem;
      border-top: 1px solid var(--accent);
      text-align: center;
    }
    footer img.bio-header {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 768px) {
      nav {
        margin: 1rem;
      }
      .hamburger {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg-dark);
        z-index: 100;
        border-top: 1px solid var(--accent);
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links a {
        width: 100%;
        margin-bottom: 0.5rem;
        margin-right: 0;
        padding: 0.75rem 1rem;
        text-align: center;
        border: 1px solid var(--accent);
        border-top: none;
      }
      .nav-links a:first-child {
        border-top: 1px solid var(--accent);
      }
      main {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="photos/bio_header.png" alt="Dawn Noir Finnish alt-rock band header" class="bio-header" />
  </header>
  <nav aria-label="Main navigation">
    <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" onclick="toggleNav()"></button>
    <div class="nav-links">
      <a href="/" aria-label="Dawn Noir homepage">Home</a>
      <a href="/bio.html" aria-label="Dawn Noir biography">Bio</a>
      <a href="/live.html" aria-label="Dawn Noir live performances">Live</a>
      <a href="/press.html" aria-current="page">Press</a>
    </div>
  </nav>
  <main>
    <h1>Dawn Noir Press Kit</h1>
    <p>Download our full press kit including high-resolution photos, biography, and promotional materials for media use.</p>
    <p><a href="https://drive.google.com/drive/u/2/folders/1sZHLcWKKlXbx_3zTjjDD_eiUGIBmOnNV" target="_blank" rel="noopener noreferrer" aria-label="Download Dawn Noir press kit from Google Drive">Download Press Kit (Google Drive)</a></p>
    <p>For interviews, questions and other inquiries contact <a href="mailto:dawnnoirband@gmail.com" aria-label="Contact Dawn Noir for press inquiries">dawnnoirband@gmail.com</a></p>
  </main>
  <footer>
    <p><a href="mailto:dawnnoirband@gmail.com" aria-label="Contact Dawn Noir via email">dawnnoirband@gmail.com</a></p>
  </footer>
  <script>
    function toggleNav() {
      const navLinks = document.querySelector('.nav-links');
      const hamburger = document.querySelector('.hamburger');
      navLinks.classList.toggle('active');
      const isExpanded = navLinks.classList.contains('active');
      hamburger.setAttribute('aria-expanded', isExpanded);
    }
  </script>
</body>
</html>
