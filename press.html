<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dawn Noir - Press</title>
  <style>
    :root {
      --bg-dark: #000000;
      --fg-light: #ffffff;
      --accent: #cccccc;
      --font-main: Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--fg-light);
      line-height: 1.6;
    }
    header {
      padding: 0;
      border-bottom: 1px solid var(--accent);
    }
    header img.bio-header {
      width: 100%;
      height: auto;
      display: block;
    }
    nav {
      margin: 1rem 2rem;
    }
    nav a {
      color: var(--fg-light);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      margin-right: 0.5rem;
    }
    nav a:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }
    main {
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    footer {
      padding: 2rem;
      border-top: 1px solid var(--accent);
      text-align: center;
    }
    footer img.bio-header {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="photos/bio_header.png" alt="Dawn Noir" class="bio-header" />
  </header>
  <nav>
    <a href="/">Home</a>
    <a href="/live.html">Live</a>
    <a href="/press.html">Press</a>
  </nav>
  <main>
    <p>Download our full press kit including high-resolution photos, bio, and promotional materials.</p>
    <p><a href="https://drive.google.com/drive/u/2/folders/1sZHLcWKKlXbx_3zTjjDD_eiUGIBmOnNV" target="_blank" rel="noopener noreferrer">Download Press Kit (Google Drive)</a></p>
    <p>For interviews, questions and other inquiries contact dawnnoirband@gmail.com</p>
  </main>
  <footer>
    dawnnoirband@gmail.com
  </footer>
</body>
</html>
